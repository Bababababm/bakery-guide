<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bakery Oven Guide</title><style>
:root{font-family:system-ui,Arial;color:#f6f4ee;background:#151c21}*{box-sizing:border-box}body{margin:0}header{background:#24343a;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:21px;margin:0}button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer;background:#edbd67;color:#1b2529}button:disabled{opacity:.5}main{max-width:1100px;margin:auto;padding:18px}input{font:inherit}#search{padding:13px;width:100%;border-radius:10px;border:1px solid #59686c;background:#253238;color:white;margin:15px 0}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{background:#293a40;color:white;text-align:left;font-size:16px;min-height:75px}.panel{background:#253238;border-radius:15px;padding:18px;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#36474d;padding:14px;border-radius:10px}.stat small{display:block;color:#b9c8c8}.stat strong{font-size:22px}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.photo{border:1px solid #607177;border-radius:12px;overflow:hidden;background:#1c282d}.photo h3{margin:12px}.frame{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#182125;color:#9faeb2}.frame img{width:100%;height:100%;object-fit:cover}.actions{padding:12px}.actions button{width:100%}.hint{color:#b9c8c8;font-size:13px}.error{color:#ffb7a6}.success{color:#a9e3b6}@media(max-width:600px){.photos{grid-template-columns:1fr}}
